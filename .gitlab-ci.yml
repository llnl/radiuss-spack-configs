variables:
# Use the umdev LLNL service user to run CI. This prevents from running
# pipelines as an actual user.
  LLNL_SERVICE_USER: bradiuss
# Use the service user workspace. Solves permission issues, stores everything
# at the same location whoever triggers a pipeline.
  CUSTOM_CI_BUILDS_DIR: /usr/workspace/bradiuss/gitlab-runner

workflow:
  rules:
    - if: $CACHE_TARGET != null
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      variables:
        CACHE_TARGET: "main"
    - if: $CI_MERGE_REQUEST_IID
      variables:
        CACHE_TARGET: "mr-${CI_MERGE_REQUEST_IID}"
    - if: $CI_COMMIT_REF_SLUG
      variables:
        CACHE_TARGET: "ref-${CI_COMMIT_REF_SLUG}"
    - when: always
      variables:
        CACHE_TARGET: "manual"

stages:
  - setup
  - generate
  - build
  - clean

include:
  - project: 'lc-templates/id_tokens'
    file: 'id_tokens.yml'
  - local: .gitlab/variables.yml
    rules:
      - if: '$MY_ENV_NAME != null && $MY_ENV_NAME != ""'
  - local: .gitlab/spack/envs/${MY_ENV_NAME}/pipeline.yml
    rules:
      - if: '$MY_ENV_NAME != null && $MY_ENV_NAME != ""'

# Run a simple job to display instructions when no env name was specified.
no-env-name:
  tags: [shell, oslic]
  rules:
    - if: '$MY_ENV_NAME == null || $MY_ENV_NAME == ""'
      when: always
    - when: never
  stage: setup
  script:
      echo -e "\e[31mVariable \"MY_ENV_NAME\" was not set.\e[0m"
      echo -e "\e[31m\"MY_ENV_NAME\" is required and should point to an existing directory in .gitlab/spack/envs.\e[0m"
      echo -e "\e[31m\"MY_ENV_NAME\" can only be defined in GitLab UI (see documentation).\e[0m"
      echo -e "\e[31mAvailable environments \e[0m"
      echo -e "\e[31m$(ls --ignore empty .gitlab/spack/envs)\e[0m"

cleanup-merged-cache-targets:
  tags: [shell, oslic]
  stage: clean
  rules:
    # MY_ENV_NAME is configured in GitLab UI and cannot realistically be unset per pipeline
    # once defined. We intentionally trigger global cleanup only on explicit empty override.
    - if: '$MY_ENV_NAME == "" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success
    - when: never
  script:
    - python3 .gitlab/scripts/cleanup-target-roots.py
