# Complete compiler stack; shared packages.yaml retains generic externals.
packages:
  c:
    require:
    - llvm@=19.1.3
  cxx:
    require:
    - llvm@=19.1.3
  fortran:
    require:
    - gcc@=13.3.1
  llvm:
    buildable: false
    externals:
    - spec: llvm@19.1.3+clang~flang~lld~lldb
      prefix: /usr/tce/packages/clang/clang-19.1.3
      extra_attributes:
        compilers:
          c: /usr/tce/packages/clang/clang-19.1.3/bin/clang
          cxx: /usr/tce/packages/clang/clang-19.1.3/bin/clang++
        flags:
          cflags: --gcc-install-dir=/usr/tce/packages/gcc/gcc-13.3.1/lib/gcc/x86_64-redhat-linux/13
          cxxflags: --gcc-install-dir=/usr/tce/packages/gcc/gcc-13.3.1/lib/gcc/x86_64-redhat-linux/13
        environment: {}
        extra_rpaths: []
  gcc:
    buildable: false
    externals:
    - spec: gcc@13.3.1 languages='c,c++,fortran'
      prefix: /usr/tce/packages/gcc/gcc-13.3.1
      extra_attributes:
        compilers:
          c: /usr/tce/packages/gcc/gcc-13.3.1/bin/gcc
          cxx: /usr/tce/packages/gcc/gcc-13.3.1/bin/g++
          fortran: /usr/tce/packages/gcc/gcc-13.3.1/bin/gfortran
        flags: {}
        environment: {}
        extra_rpaths: []
  gcc-runtime:
    require:
    - '@=13.3.1 %gcc@=13.3.1'
  mpi:
    require:
    - mvapich2@=2.3.7.clang_19
  mvapich2:
    buildable: false
    externals:
    - spec: mvapich2@2.3.7.clang_19 ~cuda~debug~regcache~wrapperrpath ch3_rank_bits=32 file_systems=lustre,nfs,ufs process_managers=slurm %llvm@=19.1.3
      prefix: /usr/tce/packages/mvapich2/mvapich2-2.3.7-clang-19.1.3
