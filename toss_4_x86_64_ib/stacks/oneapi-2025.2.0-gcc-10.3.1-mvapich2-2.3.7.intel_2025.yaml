# Complete compiler stack; shared packages.yaml retains generic externals.
packages:
  c:
    require:
    - intel-oneapi-compilers@=2025.2.0
  cxx:
    require:
    - intel-oneapi-compilers@=2025.2.0
  fortran:
    require:
    - intel-oneapi-compilers@=2025.2.0
  intel-oneapi-compilers:
    buildable: false
    externals:
    - spec: intel-oneapi-compilers@2025.2.0
      prefix: /usr/tce/packages/intel/intel-2025.2.0
      extra_attributes:
        compilers:
          c: /usr/tce/packages/intel/intel-2025.2.0/compiler/2025.2/bin/icx
          cxx: /usr/tce/packages/intel/intel-2025.2.0/compiler/2025.2/bin/icpx
          fortran: /usr/tce/packages/intel/intel-2025.2.0/compiler/2025.2/bin/ifx
        flags:
          cflags: --gcc-toolchain=/usr/tce/packages/gcc/gcc-10.3.1
          cxxflags: --gcc-toolchain=/usr/tce/packages/gcc/gcc-10.3.1
          fflags: -gcc-name=/usr/tce/packages/gcc/gcc-10.3.1/bin/gcc
        environment: {}
        extra_rpaths: []
  gcc:
    buildable: false
    externals:
    - spec: gcc@10.3.1 languages='c,c++,fortran'
      prefix: /usr/tce/packages/gcc/gcc-10.3.1
      extra_attributes:
        compilers:
          c: /usr/tce/packages/gcc/gcc-10.3.1/bin/gcc
          cxx: /usr/tce/packages/gcc/gcc-10.3.1/bin/g++
          fortran: /usr/tce/packages/gcc/gcc-10.3.1/bin/gfortran
        flags: {}
        environment: {}
        extra_rpaths: []
  gcc-runtime:
    require:
    - '@=10.3.1 %gcc@=10.3.1'
  intel-oneapi-runtime:
    require:
    - '@=2025.2.0 %intel-oneapi-compilers@=2025.2.0'
  mpi:
    require:
    - mvapich2@=2.3.7.intel_2025
  mvapich2:
    buildable: false
    externals:
    - spec: mvapich2@2.3.7.intel_2025 ~cuda~debug~regcache~wrapperrpath ch3_rank_bits=32 file_systems=lustre,nfs,ufs process_managers=slurm %intel-oneapi-compilers@=2025.2.0
      prefix: /usr/tce/packages/mvapich2/mvapich2-2.3.7-intel-2025.2.0
