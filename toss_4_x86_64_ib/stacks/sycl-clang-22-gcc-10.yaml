# Complete compiler stack; shared packages.yaml retains generic externals.
# No matching installed MPI is configured. MPI-enabled specs must fail
# until a compatible external is verified and added to this stack.
packages:
  c:
    require:
    - llvm@=22.0.0git
  cxx:
    require:
    - llvm@=22.0.0git
  fortran:
    require:
    - gcc@=10.3.1
  llvm:
    buildable: false
    externals:
    - spec: llvm@22.0.0git+clang~flang~lld~lldb
      prefix: /usr/workspace/raja-dev/clang_sycl_16b7bcb09915_hip_gcc10.3.1_rocm6.4.3
      extra_attributes:
        compilers:
          c: /usr/workspace/raja-dev/clang_sycl_16b7bcb09915_hip_gcc10.3.1_rocm6.4.3/bin/clang
          cxx: /usr/workspace/raja-dev/clang_sycl_16b7bcb09915_hip_gcc10.3.1_rocm6.4.3/bin/clang++
        flags: {}
        environment: {}
        extra_rpaths: [/usr/workspace/raja-dev/clang_sycl_16b7bcb09915_hip_gcc10.3.1_rocm6.4.3/lib, /usr/workspace/raja-dev/clang_sycl_16b7bcb09915_hip_gcc10.3.1_rocm6.4.3/lib64]
  gcc:
    buildable: false
    externals:
    - spec: gcc@10.3.1 languages='c,c++,fortran'
      prefix: /usr/tce/packages/gcc/gcc-10.3.1
      extra_attributes:
        compilers:
          c: /usr/tce/packages/gcc/gcc-10.3.1/bin/gcc
          cxx: /usr/tce/packages/gcc/gcc-10.3.1/bin/g++
          fortran: /usr/tce/packages/gcc/gcc-10.3.1/bin/gfortran
        flags: {}
        environment: {}
        extra_rpaths: []
  gcc-runtime:
    require:
    - '@=10.3.1 %gcc@=10.3.1'
  mpi:
    require:
    - mvapich2
  mvapich2:
    buildable: false
  cuda:
    version: [13.1.1, 12.9.1, 12.6.0, 12.2.2, 11.8.0, 11.7.0, 11.5.0, 11.2.0, 11.1.0, 10.2.89, 10.1.168]
    buildable: false
    externals:
    - spec: cuda@13.1.1+allow-unsupported-compilers
      prefix: /usr/tce/packages/cuda/cuda-13.1.1
    - spec: cuda@12.9.1+allow-unsupported-compilers
      prefix: /usr/tce/packages/cuda/cuda-12.9.1
    - spec: cuda@12.6.0+allow-unsupported-compilers
      prefix: /usr/tce/packages/cuda/cuda-12.6.0
    - spec: cuda@12.2.2+allow-unsupported-compilers
      prefix: /usr/tce/packages/cuda/cuda-12.2.2
    - spec: cuda@11.8.0+allow-unsupported-compilers
      prefix: /usr/tce/packages/cuda/cuda-11.8.0
    - spec: cuda@11.7.0+allow-unsupported-compilers
      prefix: /usr/tce/packages/cuda/cuda-11.7.0
    - spec: cuda@11.5.0+allow-unsupported-compilers
      prefix: /usr/tce/packages/cuda/cuda-11.5.0
    - spec: cuda@11.2.0+allow-unsupported-compilers
      prefix: /usr/tce/packages/cuda/cuda-11.2.0
    - spec: cuda@11.1.0+allow-unsupported-compilers
      prefix: /usr/tce/packages/cuda/cuda-11.1.0
    - spec: cuda@10.2.89+allow-unsupported-compilers
      prefix: /usr/tce/packages/cuda/cuda-10.2.89
    - spec: cuda@10.1.168+allow-unsupported-compilers
      prefix: /usr/tce/packages/cuda/cuda-10.1.168
