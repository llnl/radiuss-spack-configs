# Complete compiler stack; shared packages.yaml retains generic externals.
# MPI compatibility exception: prebuilt with gcc@=13.3.1.
# Its compiler binding is deliberately omitted; the prefix retains provenance.
packages:
  c:
    require:
    - llvm@=18.1.8
  cxx:
    require:
    - llvm@=18.1.8
  fortran:
    require:
    - gcc@=13.3.1
  llvm:
    buildable: false
    externals:
    - spec: llvm@18.1.8+clang~flang~lld~lldb
      prefix: /usr/tce/packages/clang/clang-18.1.8
      extra_attributes:
        compilers:
          c: /usr/tce/packages/clang/clang-18.1.8/bin/clang
          cxx: /usr/tce/packages/clang/clang-18.1.8/bin/clang++
        flags:
          cflags: --gcc-install-dir=/usr/tce/packages/gcc/gcc-13.3.1/lib/gcc/x86_64-redhat-linux/13
          cxxflags: --gcc-install-dir=/usr/tce/packages/gcc/gcc-13.3.1/lib/gcc/x86_64-redhat-linux/13
        environment: {}
        extra_rpaths: []
  gcc:
    buildable: false
    externals:
    - spec: gcc@13.3.1 languages='c,c++,fortran'
      prefix: /usr/tce/packages/gcc/gcc-13.3.1
      extra_attributes:
        compilers:
          c: /usr/tce/packages/gcc/gcc-13.3.1/bin/gcc
          cxx: /usr/tce/packages/gcc/gcc-13.3.1/bin/g++
          fortran: /usr/tce/packages/gcc/gcc-13.3.1/bin/gfortran
        flags: {}
        environment: {}
        extra_rpaths: []
  gcc-runtime:
    require:
    - '@=13.3.1 %gcc@=13.3.1'
  mpi:
    require:
    - mvapich2@=2.3.7.gcc_13
  mvapich2:
    buildable: false
    externals:
    - spec: mvapich2@2.3.7.gcc_13 ~cuda~debug~regcache~wrapperrpath ch3_rank_bits=32 file_systems=lustre,nfs,ufs process_managers=slurm
      prefix: /usr/tce/packages/mvapich2/mvapich2-2.3.7-gcc-13.3.1

  # System packages (use dnf)
  cuda:
    version: [13.1.1, 12.9.1, 12.6.0, 12.2.2, 11.8.0, 11.7.0, 11.5.0, 11.2.0, 11.1.0, 10.2.89, 10.1.168]
    buildable: false
    externals:
    - spec: cuda@13.1.1+allow-unsupported-compilers
      prefix: /usr/tce/packages/cuda/cuda-13.1.1
    - spec: cuda@12.9.1+allow-unsupported-compilers
      prefix: /usr/tce/packages/cuda/cuda-12.9.1
    - spec: cuda@12.6.0+allow-unsupported-compilers
      prefix: /usr/tce/packages/cuda/cuda-12.6.0
    - spec: cuda@12.2.2+allow-unsupported-compilers
      prefix: /usr/tce/packages/cuda/cuda-12.2.2
    - spec: cuda@11.8.0+allow-unsupported-compilers
      prefix: /usr/tce/packages/cuda/cuda-11.8.0
    - spec: cuda@11.7.0+allow-unsupported-compilers
      prefix: /usr/tce/packages/cuda/cuda-11.7.0
    - spec: cuda@11.5.0+allow-unsupported-compilers
      prefix: /usr/tce/packages/cuda/cuda-11.5.0
    - spec: cuda@11.2.0+allow-unsupported-compilers
      prefix: /usr/tce/packages/cuda/cuda-11.2.0
    - spec: cuda@11.1.0+allow-unsupported-compilers
      prefix: /usr/tce/packages/cuda/cuda-11.1.0
    - spec: cuda@10.2.89+allow-unsupported-compilers
      prefix: /usr/tce/packages/cuda/cuda-10.2.89
    - spec: cuda@10.1.168+allow-unsupported-compilers
      prefix: /usr/tce/packages/cuda/cuda-10.1.168
