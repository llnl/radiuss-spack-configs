# Complete compiler stack; shared packages.yaml retains generic externals.
# MPI compatibility exception: prebuilt with gcc@=13.3.1.
# Its compiler binding is deliberately omitted; the prefix retains provenance.
packages:
  all:
    # GPU support is selected by roots; the stack supplies its hardware target.
    # Package-specific require can bypass this fallback; CI audits the DAG.
    require:
    - spec: cuda_arch=90
      when: '+cuda'
  c:
    require:
    - llvm@=18.1.8
  cxx:
    require:
    - llvm@=18.1.8
  fortran:
    require:
    - gcc@=13.3.1
  llvm:
    buildable: false
    externals:
    - spec: llvm@18.1.8+clang~flang~lld~lldb
      prefix: /usr/tce/packages/clang/clang-18.1.8
      extra_attributes:
        compilers:
          c: /usr/tce/packages/clang/clang-18.1.8/bin/clang
          cxx: /usr/tce/packages/clang/clang-18.1.8/bin/clang++
        flags:
          cflags: --gcc-install-dir=/usr/tce/packages/gcc/gcc-13.3.1/lib/gcc/x86_64-redhat-linux/13
          cxxflags: --gcc-install-dir=/usr/tce/packages/gcc/gcc-13.3.1/lib/gcc/x86_64-redhat-linux/13
        environment: {}
        extra_rpaths: []
  gcc:
    buildable: false
    externals:
    - spec: gcc@13.3.1 languages='c,c++,fortran'
      prefix: /usr/tce/packages/gcc/gcc-13.3.1
      extra_attributes:
        compilers:
          c: /usr/tce/packages/gcc/gcc-13.3.1/bin/gcc
          cxx: /usr/tce/packages/gcc/gcc-13.3.1/bin/g++
          fortran: /usr/tce/packages/gcc/gcc-13.3.1/bin/gfortran
        flags: {}
        environment: {}
        extra_rpaths: []
  gcc-runtime:
    require:
    - '@=13.3.1 %gcc@=13.3.1'
  mpi:
    require:
    - mvapich2@=2.3.7.gcc_13
  mvapich2:
    buildable: false
    externals:
    - spec: mvapich2@2.3.7.gcc_13 ~cuda~debug~regcache~wrapperrpath ch3_rank_bits=32 file_systems=lustre,nfs,ufs process_managers=slurm
      prefix: /usr/tce/packages/mvapich2/mvapich2-2.3.7-gcc-13.3.1

  # Replace the shared CUDA catalog with this tested toolkit.
  cuda::
    require:
    - '@=13.1.1 +allow-unsupported-compilers'
    buildable: false
    externals:
    - spec: cuda@13.1.1+allow-unsupported-compilers
      prefix: /usr/tce/packages/cuda/cuda-13.1.1
