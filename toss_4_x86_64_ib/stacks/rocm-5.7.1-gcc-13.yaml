# Complete compiler stack; shared packages.yaml retains generic externals.
# Spack declares ROCm Fortran only from version 7; use the selected GCC.
# MPI compatibility exception: prebuilt with gcc@=13.3.1.
# Its compiler binding is deliberately omitted; the prefix retains provenance.
packages:
  c:
    require:
    - llvm-amdgpu@=5.7.1
  cxx:
    require:
    - llvm-amdgpu@=5.7.1
  fortran:
    require:
    - gcc@=13.3.1
  llvm-amdgpu:
    buildable: false
    externals:
    - spec: llvm-amdgpu@5.7.1
      prefix: /opt/rocm-5.7.1
      extra_attributes:
        compilers:
          c: /opt/rocm-5.7.1/llvm/bin/amdclang
          cxx: /opt/rocm-5.7.1/llvm/bin/amdclang++
        flags: {}
        environment: {}
        extra_rpaths: [/opt/rocm-5.7.1/lib, /opt/rocm-5.7.1/llvm/lib]
  gcc:
    buildable: false
    externals:
    - spec: gcc@13.3.1 languages='c,c++,fortran'
      prefix: /usr/tce/packages/gcc/gcc-13.3.1
      extra_attributes:
        compilers:
          c: /usr/tce/packages/gcc/gcc-13.3.1/bin/gcc
          cxx: /usr/tce/packages/gcc/gcc-13.3.1/bin/g++
          fortran: /usr/tce/packages/gcc/gcc-13.3.1/bin/gfortran
        flags: {}
        environment: {}
        extra_rpaths: []
  gcc-runtime:
    require:
    - '@=13.3.1 %gcc@=13.3.1'
  mpi:
    require:
    - mvapich2@=2.3.7.gcc_13
  mvapich2:
    buildable: false
    externals:
    - spec: mvapich2@2.3.7.gcc_13 ~cuda~debug~regcache~wrapperrpath ch3_rank_bits=32 file_systems=lustre,nfs,ufs process_managers=slurm
      prefix: /usr/tce/packages/mvapich2/mvapich2-2.3.7-gcc-13.3.1

  # System packages (use dnf)
  hip:
    require:
    - '@=5.7.1'
    buildable: false
    externals:
    - spec: hip@5.7.1%llvm-amdgpu@5.7.1
      prefix: /opt/rocm-5.7.1/hip
  hipsparse:
    require:
    - '@=5.7.1'
    buildable: false
    externals:
    - spec: hipsparse@5.7.1%llvm-amdgpu@5.7.1
      prefix: /opt/rocm-5.7.1
  hsa-rocr-dev:
    require:
    - '@=5.7.1'
    buildable: false
    externals:
    - spec: hsa-rocr-dev@5.7.1%llvm-amdgpu@5.7.1
      prefix: /opt/rocm-5.7.1
  rocminfo:
    require:
    - '@=5.7.1'
    buildable: false
    externals:
    - spec: rocminfo@5.7.1%llvm-amdgpu@5.7.1
      prefix: /opt/rocm-5.7.1
  rocm-device-libs:
    require:
    - '@=5.7.1'
    buildable: false
    externals:
    - spec: rocm-device-libs@5.7.1%llvm-amdgpu@5.7.1
      prefix: /opt/rocm-5.7.1/
  rocprim:
    require:
    - '@=5.7.1'
    buildable: false
    externals:
    - spec: rocprim@5.7.1%llvm-amdgpu@5.7.1
      prefix: /opt/rocm-5.7.1/
  rocprofiler-sdk:
    buildable: false
