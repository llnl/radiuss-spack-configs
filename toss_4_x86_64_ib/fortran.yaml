# Apply the toolchain Fortran provider to consumers with a direct Fortran edge.
# Name each configured Fortran provider in the condition: bare %fortran can
# match Fortran elsewhere in the DAG, while a virtual-only edge does not
# bind the provider in Spack 1.2.2 requirement conditions.
# Roots keep their feature defaults; compiler_mixing constrains link/run consumers.
# Keep these providers and one mapping per C/C++ version aligned with packages.yaml.
# Package-specific require lists replace all.require; extend them if needed.
packages:
  all:
    require:
    - spec: "%fortran=gcc@=10.3.1"
      when: "%c=gcc@=10.3.1 %fortran=gcc"
    - spec: "%fortran=gcc@=10.3.1"
      when: "%c=gcc@=10.3.1 %fortran=intel-oneapi-compilers"
    - spec: "%fortran=gcc@=10.3.1"
      when: "%c=gcc@=10.3.1 %fortran=intel-oneapi-compilers-classic"
    - spec: "%fortran=gcc@=10.3.1"
      when: "%c=gcc@=10.3.1 %fortran=llvm-amdgpu"
    - spec: "%fortran=gcc@=10.3.1"
      when: "%cxx=gcc@=10.3.1 %fortran=gcc"
    - spec: "%fortran=gcc@=10.3.1"
      when: "%cxx=gcc@=10.3.1 %fortran=intel-oneapi-compilers"
    - spec: "%fortran=gcc@=10.3.1"
      when: "%cxx=gcc@=10.3.1 %fortran=intel-oneapi-compilers-classic"
