packages:
  all:
    require:
    - 'target=sapphirerapids'
    - spec: ^mvapich2
      when: '^mpi'
    providers:
      blas: [openblas]
      lapack: [netlib-lapack]
      mpi: [mvapich2]
      zlib-api: [zlib]
      pkgconfig: [pkgconf]
  cmake:
    version: [3.25.2, 3.23.1, 3.22.4, 3.21.1, 3.19.2, 3.14.5]
    buildable: false
    externals:
    - spec: cmake@3.14.5
      prefix: /usr/tce/packages/cmake/cmake-3.14.5
    - spec: cmake@3.19.2
      prefix: /usr/tce/packages/cmake/cmake-3.19.2
    - spec: cmake@3.21.1
      prefix: /usr/tce/packages/cmake/cmake-3.21.1
    - spec: cmake@3.22.4
      prefix: /usr/tce/packages/cmake/cmake-3.22.4
    - spec: cmake@3.23.1
      prefix: /usr/tce/packages/cmake/cmake-3.23.1
    - spec: cmake@3.25.2
      prefix: /usr/tce/packages/cmake/cmake-3.25.2
  ninja:
    version: [1.11.1]
    buildable: false
    externals:
    - spec: ninja@1.11.1
      prefix: /usr/tce/packages/ninja/ninja-1.11.1
  papi:
    version: [6.0.0.1]
    buildable: false
    externals:
    - spec: papi@6.0.0.1
      prefix: /usr/tce/packages/papi/papi-6.0.0.1
  python:
    version: [3.9.12]
    buildable: false
    externals:
    - spec: python@3.9.12
      prefix: /usr/tce/packages/python/python-3.9.12

