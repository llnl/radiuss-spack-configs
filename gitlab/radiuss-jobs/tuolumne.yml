# ROCm 6.4.3 provides C/C++; use GCC for required Fortran.
rocmcc_6_4_3_hip:
  variables:
    RADIUSS_SPACK_STACK: "rocm-6.4.3-gcc-13"
    SPEC: "${PROJECT_TUOLUMNE_VARIANTS} +rocm amdgpu_target=gfx942 ${PROJECT_TUOLUMNE_DEPS}"
  extends: .job_on_tuolumne

# The selected stack fixes language providers throughout the dependency graph.
rocmcc_7_2_1_hip:
  variables:
    RADIUSS_SPACK_STACK: "rocm-7.2.1"
    SPEC: "${PROJECT_TUOLUMNE_VARIANTS} +rocm amdgpu_target=gfx942 ${PROJECT_TUOLUMNE_DEPS}"
  extends: .job_on_tuolumne

cce_21_0_0:
  variables:
    RADIUSS_SPACK_STACK: "cce-21.0.0"
    SPEC: "${PROJECT_TUOLUMNE_VARIANTS} ${PROJECT_TUOLUMNE_DEPS}"
  extends: .job_on_tuolumne
