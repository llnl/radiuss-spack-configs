# Each group owns one complete compiler stack, unified independently.
spack:
  #[general--]
  repos:
    builtin:
      git: https://github.com/spack/spack-packages.git
      commit: 4b6b842d494ab86ebef5304e6bfe766aa421a66b
  include:
  - $LCSCHEDCLUSTER/config.yaml
  - $LCSCHEDCLUSTER/packages.yaml
  - ci.yaml
  concretizer:
    reuse: false
    # Unification applies independently within each compiler-stack group.
    unify: true
    compiler_mixing: false
  view: false
  #[--general]

  #[config-override--]
  config:
    install_tree:
      root: /usr/workspace/radiuss/install/bradiuss-spack-install-dbv8
      padded_length: 128
      projections:
        all: '{architecture}/{compiler.name}-{compiler.version}/{name}-{version}-{hash}'
    'build_stage:':
    - $user_cache_path/stage
    test_stage: $user_cache_path/test
    misc_cache: $user_cache_path/misc
    flags:
      keep_werror: all
  #[--config-override]

  #[definitions--]
  definitions:
  - cached-cmake-projects: [umpire, raja, raja-perf, chai, care, aluminum, axom, dihydrogen, hydrogen, lbann, sina]
  # MPI is requested on the Caliper root; it is not propagated as a variant.
  - cached-cmake-projects: ['caliper +mpi']
    when: env.get("LCSCHEDCLUSTER", "") in ("dane", "matrix")
  - cached-cmake-projects: [caliper]
    when: env.get("LCSCHEDCLUSTER", "") not in ("dane", "matrix")

  # Empty lists keep groups inactive outside their machine families.
  - dane: []
  - dane: [$cached-cmake-projects]
    when: env.get("LCSCHEDCLUSTER", "") == "dane"
  - corona: []
  - corona: [$cached-cmake-projects]
    when: env.get("LCSCHEDCLUSTER", "") == "corona"
  - cray: []
  - cray: [$cached-cmake-projects]
    when: env.get("LCSCHEDCLUSTER", "") in ("tioga", "tuolumne")

  - cuda-arch: []
  - cuda-arch: ['+cuda cuda_arch=90']
    when: env.get("LCSCHEDCLUSTER", "") in ("dane", "matrix")
  - amdgpu-arch: []
  - amdgpu-arch: ['+rocm amdgpu_target=gfx906']
    when: env.get("LCSCHEDCLUSTER", "") == "corona"
  - amdgpu-arch: ['+rocm amdgpu_target=gfx90a']
    when: env.get("LCSCHEDCLUSTER", "") == "tioga"
  - amdgpu-arch: ['+rocm amdgpu_target=gfx942']
    when: env.get("LCSCHEDCLUSTER", "") == "tuolumne"
  #[--definitions]

  specs:
  # Dane CPU stacks.
  - group: gcc-13.3.1-mvapich2-2.3.7.gcc_13
    specs: [$dane]
    override:
      include:
      - path: $env/$LCSCHEDCLUSTER/stacks/gcc-13.3.1-mvapich2-2.3.7.gcc_13.yaml
        when: env.get("LCSCHEDCLUSTER", "") == "dane"

  - group: clang-19.1.3-gcc-13.3.1-mvapich2-2.3.7.clang_19
    specs: [$dane]
    override:
      include:
      - path: $env/$LCSCHEDCLUSTER/stacks/clang-19.1.3-gcc-13.3.1-mvapich2-2.3.7.clang_19.yaml
        when: env.get("LCSCHEDCLUSTER", "") == "dane"

  - group: oneapi-2025.2.0-gcc-10.3.1-mvapich2-2.3.7.intel_2025
    specs: [$dane]
    override:
      include:
      - path: $env/$LCSCHEDCLUSTER/stacks/oneapi-2025.2.0-gcc-10.3.1-mvapich2-2.3.7.intel_2025.yaml
        when: env.get("LCSCHEDCLUSTER", "") == "dane"

  # Dane/Matrix CUDA coverage is retained, including Clang 18.
  - group: clang-18.1.8-gcc-13.3.1-mvapich2-2.3.7.gcc_13-cuda-12.6.0
    matrix:
    - [$cached-cmake-projects]
    - [$cuda-arch]
    # Sina has no CUDA variant.
    exclude: [sina]
    override:
      include:
      - path: $env/$LCSCHEDCLUSTER/stacks/clang-18.1.8-gcc-13.3.1-mvapich2-2.3.7.gcc_13-cuda-12.6.0.yaml
        when: env.get("LCSCHEDCLUSTER", "") in ("dane", "matrix")

  # ROCm 6.4.3 with GCC Fortran and the machine family's MPI.
  - group: rocm-6.4.3-gcc-13.3.1-mvapich2-2.3.7.gcc_13
    matrix:
    - [$corona]
    - [$amdgpu-arch]
    # Sina has no ROCm variant.
    exclude: [sina]
    override:
      include:
      - path: $env/$LCSCHEDCLUSTER/stacks/rocm-6.4.3-gcc-13.3.1-mvapich2-2.3.7.gcc_13.yaml
        when: env.get("LCSCHEDCLUSTER", "") == "corona"

  - group: rocm-6.4.3-gcc-13.3.1-cray-mpich-9.0.1
    matrix:
    - [$cray]
    - [$amdgpu-arch]
    # Sina has no ROCm variant.
    exclude: [sina]
    override:
      include:
      - path: $env/$LCSCHEDCLUSTER/stacks/rocm-6.4.3-gcc-13.3.1-cray-mpich-9.0.1.yaml
        when: env.get("LCSCHEDCLUSTER", "") in ("tioga", "tuolumne")

  - group: rocm-7.2.1-cray-mpich-9.1.0
    matrix:
    - [$cray]
    - [$amdgpu-arch]
    # raja-perf@2025.03 requests C++14; rocprim 7.2.1 requires C++17.
    exclude: [raja-perf, sina]
    override:
      include:
      - path: $env/$LCSCHEDCLUSTER/stacks/rocm-7.2.1-cray-mpich-9.1.0.yaml
        when: env.get("LCSCHEDCLUSTER", "") in ("tioga", "tuolumne")

  - group: cce-20.0.0-cray-mpich-9.0.1
    specs: [$cray]
    override:
      include:
      - path: $env/$LCSCHEDCLUSTER/stacks/cce-20.0.0-cray-mpich-9.0.1.yaml
        when: env.get("LCSCHEDCLUSTER", "") in ("tioga", "tuolumne")

  - group: cce-21.0.0-cray-mpich-9.1.0
    specs: [$cray]
    override:
      include:
      - path: $env/$LCSCHEDCLUSTER/stacks/cce-21.0.0-cray-mpich-9.1.0.yaml
        when: env.get("LCSCHEDCLUSTER", "") in ("tioga", "tuolumne")
