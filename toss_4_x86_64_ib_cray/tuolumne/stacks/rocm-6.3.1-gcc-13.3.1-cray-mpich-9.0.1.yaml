# Complete compiler stack; shared packages.yaml retains generic externals.
# Spack declares ROCm Fortran only from version 7; use the selected GCC.
packages:
  all:
    # GPU support is selected by roots; the stack supplies its hardware target.
    # Package-specific require can bypass this fallback; CI audits the DAG.
    require:
    - spec: amdgpu_target=gfx942
      when: '+rocm'
  c:
    require:
    - llvm-amdgpu@=6.3.1
  cxx:
    require:
    - llvm-amdgpu@=6.3.1
  fortran:
    require:
    - gcc@=13.3.1
  llvm-amdgpu:
    buildable: false
    externals:
    - spec: llvm-amdgpu@6.3.1
      prefix: /opt/rocm-6.3.1
      extra_attributes:
        compilers:
          c: /opt/rocm-6.3.1/llvm/bin/amdclang
          cxx: /opt/rocm-6.3.1/llvm/bin/amdclang++
        flags: {}
        environment: {}
        extra_rpaths: [/opt/rocm-6.3.1/lib, /opt/rocm-6.3.1/llvm/lib, /opt/cray/pe/mpich/9.0.1/gtl/lib]
  gcc:
    buildable: false
    externals:
    - spec: gcc@13.3.1 languages='c,c++,fortran'
      prefix: /usr/tce/packages/gcc/gcc-13.3.1-magic
      extra_attributes:
        compilers:
          c: /usr/tce/packages/gcc/gcc-13.3.1-magic/bin/gcc
          cxx: /usr/tce/packages/gcc/gcc-13.3.1-magic/bin/g++
          fortran: /usr/tce/packages/gcc/gcc-13.3.1-magic/bin/gfortran
        flags: {}
        environment: {}
        extra_rpaths: []
  gcc-runtime:
    require:
    - '@=13.3.1 %gcc@=13.3.1'
  mpi:
    require:
    - cray-mpich@=9.0.1
  cray-mpich:
    buildable: false
    externals:
    - spec: cray-mpich@9.0.1%llvm-amdgpu@6.3.1
      prefix: /usr/tce/packages/cray-mpich/cray-mpich-9.0.1-rocmcc-6.3.1-magic
  hip:
    require:
    - '@=6.3.1'
    buildable: false
    externals:
    - spec: hip@6.3.1%llvm-amdgpu@6.3.1
      prefix: /opt/rocm-6.3.1
  hipsparse:
    require:
    - '@=6.3.1'
    buildable: false
    externals:
    - spec: hipsparse@6.3.1%llvm-amdgpu@6.3.1
      prefix: /opt/rocm-6.3.1
  hipblas:
    require:
    - '@=6.3.1'
    buildable: false
    externals:
    - spec: hipblas@6.3.1%llvm-amdgpu@6.3.1 ^hipblas-common@6.3.1
      prefix: /opt/rocm-6.3.1
  hipblas-common:
    require:
    - '@=6.3.1'
    buildable: false
    externals:
    - spec: hipblas-common@6.3.1
      prefix: /opt/rocm-6.3.1
  hipsolver:
    require:
    - '@=6.3.1'
    buildable: false
    externals:
    - spec: hipsolver@6.3.1%llvm-amdgpu@6.3.1
      prefix: /opt/rocm-6.3.1
  hsa-rocr-dev:
    require:
    - '@=6.3.1'
    buildable: false
    externals:
    - spec: hsa-rocr-dev@6.3.1%llvm-amdgpu@6.3.1
      prefix: /opt/rocm-6.3.1
  rocminfo:
    require:
    - '@=6.3.1'
    buildable: false
    externals:
    - spec: rocminfo@6.3.1%llvm-amdgpu@6.3.1
      prefix: /opt/rocm-6.3.1
  rocm-device-libs:
