# Complete compiler stack; shared packages.yaml retains generic externals.
packages:
  c:
    require:
    - llvm-amdgpu@=7.2.1
  cxx:
    require:
    - llvm-amdgpu@=7.2.1
  fortran:
    require:
    - llvm-amdgpu@=7.2.1
  llvm-amdgpu:
    buildable: false
    externals:
    - spec: llvm-amdgpu@7.2.1
      prefix: /opt/rocm-7.2.1
      extra_attributes:
        compilers:
          c: /opt/rocm-7.2.1/llvm/bin/amdclang
          cxx: /opt/rocm-7.2.1/llvm/bin/amdclang++
          fortran: /opt/rocm-7.2.1/llvm/bin/amdflang
        flags: {}
        environment: {}
        extra_rpaths: [/opt/rocm-7.2.1/lib, /opt/rocm-7.2.1/llvm/lib, /opt/cray/pe/mpich/9.1.0/gtl/lib]
  mpi:
    require:
    - cray-mpich@=9.1.0
  cray-mpich:
    buildable: false
    externals:
    - spec: cray-mpich@9.1.0%llvm-amdgpu@7.2.1
      prefix: /usr/tce/packages/cray-mpich/cray-mpich-9.1.0-rocmcc-7.2.1-magic
  # System level packages to not build
  hip:
    require:
    - '@=7.2.1'
    buildable: false
    externals:
    - spec: hip@7.2.1%llvm-amdgpu@7.2.1
      prefix: /opt/rocm-7.2.1
  hipsparse:
    require:
    - '@=7.2.1'
    buildable: false
    externals:
    - spec: hipsparse@7.2.1%llvm-amdgpu@7.2.1
      prefix: /opt/rocm-7.2.1
  hipblas:
    require:
    - '@=7.2.1'
    buildable: false
    externals:
    - spec: hipblas@7.2.1%llvm-amdgpu@7.2.1 ^hipblas-common@7.2.1
      prefix: /opt/rocm-7.2.1
  # Note: does not depend on compiler
  hipblas-common:
    require:
    - '@=7.2.1'
    buildable: false
    externals:
    - spec: hipblas-common@7.2.1
      prefix: /opt/rocm-7.2.1
  hipsolver:
    require:
    - '@=7.2.1'
    buildable: false
    externals:
    - spec: hipsolver@7.2.1%llvm-amdgpu@7.2.1
      prefix: /opt/rocm-7.2.1
  hsa-rocr-dev:
    require:
    - '@=7.2.1'
    buildable: false
    externals:
    - spec: hsa-rocr-dev@7.2.1%llvm-amdgpu@7.2.1
      prefix: /opt/rocm-7.2.1
  rocminfo:
    require:
    - '@=7.2.1'
    buildable: false
    externals:
    - spec: rocminfo@7.2.1%llvm-amdgpu@7.2.1
      prefix: /opt/rocm-7.2.1
  rocm-device-libs:
    require:
    - '@=7.2.1'
    buildable: false
    externals:
    - spec: rocm-device-libs@7.2.1%llvm-amdgpu@7.2.1
      prefix: /opt/rocm-7.2.1
  rocprim:
    require:
    - '@=7.2.1'
    buildable: false
    externals:
    - spec: rocprim@7.2.1%llvm-amdgpu@7.2.1
      prefix: /opt/rocm-7.2.1
  rocprofiler-sdk:
    require:
    - '@=7.2.1'
    buildable: false
    externals:
    - spec: rocprofiler-sdk@7.2.1%llvm-amdgpu@7.2.1
      prefix: /opt/rocm-7.2.1
  rocthrust:
    require:
    - '@=7.2.1'
    buildable: false
    externals:
    - spec: rocthrust@7.2.1%llvm-amdgpu@7.2.1
      prefix: /opt/rocm-7.2.1
  rocsparse:
    require:
    - '@=7.2.1'
    buildable: false
    externals:
    - spec: rocsparse@7.2.1%llvm-amdgpu@7.2.1
      prefix: /opt/rocm-7.2.1
  rocrand:
    require:
    - '@=7.2.1'
    buildable: false
    externals:
    - spec: rocrand@7.2.1%llvm-amdgpu@7.2.1
      prefix: /opt/rocm-7.2.1
  rocblas:
    require:
    - '@=7.2.1'
    buildable: false
    externals:
    - spec: rocblas@7.2.1%llvm-amdgpu@7.2.1
      prefix: /opt/rocm-7.2.1
  rocsolver:
    require:
    - '@=7.2.1'
    buildable: false
    externals:
    - spec: rocsolver@7.2.1%llvm-amdgpu@7.2.1
      prefix: /opt/rocm-7.2.1
  rocm-core:
