packages:
  all:
    require:
    - 'target=zen3'
    - spec: ^cray-mpich
      when: '^mpi'
    providers:
      blas: [netlib-lapack]
      lapack: [netlib-lapack]
      mpi: [cray-mpich]
      zlib-api: [zlib]
      pkgconfig: [pkgconf]
  cmake:
    version: [3.24.2, 3.23.1, 3.22.4, 3.21.1, 3.19.2, 3.14.5]
    buildable: false
    externals:
    - spec: cmake@3.14.5
      prefix: /usr/tce/packages/cmake/cmake-3.14.5
    - spec: cmake@3.19.2
      prefix: /usr/tce/packages/cmake/cmake-3.19.2
    - spec: cmake@3.21.1
      prefix: /usr/tce/packages/cmake/cmake-3.21.1
    - spec: cmake@3.22.4
      prefix: /usr/tce/packages/cmake/cmake-3.22.4
    - spec: cmake@3.23.1
      prefix: /usr/tce/packages/cmake/cmake-3.23.1
    - spec: cmake@3.24.2
      prefix: /usr/tce/packages/cmake/cmake-3.24.2
  papi:
    buildable: false
    version: [7.2.0.1]
    externals:
    - spec: papi@7.2.0.1
      prefix: /opt/cray/pe/papi/7.2.0.1
  python:
    buildable: false
    version: [3.9.12]
    externals:
    - spec: python@3.9.12
      prefix: /usr/tce/packages/python/python-3.9.12
  autoconf:
    buildable: false
    externals:
    - spec: autoconf@2.69
      prefix: /usr
  automake:
    buildable: false
    externals:
    - spec: automake@1.16.1
      prefix: /usr
  binutils:
    buildable: false
    externals:
    - spec: binutils@2.30
      prefix: /usr
  bzip2:
    buildable: false
    externals:
    - spec: bzip2@1.0.6
      prefix: /usr
  curl:
    buildable: false
    externals:
    - spec: curl@7.61.1
      prefix: /usr
  diffutils:
    buildable: false
    externals:
    - spec: diffutils@3.6
      prefix: /usr
  elfutils:
    buildable: false
    externals:
    - spec: elfutils@0.190
      prefix: /usr
  findutils:
    buildable: false
    externals:
    - spec: findutils@4.6.0
      prefix: /usr
  gettext:
    buildable: false
    externals:
    - spec: gettext@0.19.8.1
      prefix: /usr
  ghostscript:
    buildable: false
    externals:
    - spec: ghostscript@9.27
      prefix: /usr
  git:
    buildable: false
    externals:
    - spec: git@2.29.1
      prefix: /usr/tce/
  graphviz:
    buildable: false
    externals:
    - spec: graphviz@2.40.1
      prefix: /usr
  groff:
    buildable: false
    externals:
    - spec: groff@1.22.3
      prefix: /usr
  #lapack
  netlib-lapack:
    buildable: false
    externals:
    - spec: netlib-lapack@3.8.0
      prefix: /usr
  libepoxy:
    buildable: false
    externals:
    - spec: libepoxy@1.5.8
      prefix: /usr
  libtool:
    buildable: false
    externals:
    - spec: libtool@2.4.6
      prefix: /usr
  libunwind:
    buildable: false
    externals:
    - spec: libunwind@1.3.1
      prefix: /usr
  libxcrypt:
    buildable: false
    externals:
    - spec: libxcrypt@4.1.1
      prefix: /usr
  libx11:
    buildable: false
    externals:
    - spec: libx11@1.6.8
      prefix: /usr
  libyogrt:
    externals:
    - spec: libyogrt@1.35 scheduler=flux
      prefix: /usr
    - spec: libyogrt@1.35 scheduler=slurm
      prefix: /usr
  lua:
    buildable: false
    externals:
    - spec: lua@5.3.4
      prefix: /usr
  #make
  gmake:
    buildable: false
    externals:
    - spec: gmake@4.2.1
      prefix: /usr
  m4:
    buildable: false
    externals:
    - spec: m4@1.4.18
      prefix: /usr
  ncurses:
    buildable: false
    externals:
    - spec: ncurses@6.1
      prefix: /usr
  openssl:
    buildable: false
    externals:
    - spec: openssl@1.1.1k
      prefix: /usr
  perl:
    buildable: false
    externals:
    - spec: perl@5.26.3
      prefix: /usr
  pdsh:
    buildable: false
    externals:
    - spec: pdsh@2.35
      prefix: /usr
  pkgconf:
    buildable: false
    externals:
    - spec: pkgconf@1.4.2
      prefix: /usr
  readline:
    buildable: false
    externals:
    - spec: readline@7.0
      prefix: /usr
  tar:
    buildable: false
    externals:
    - spec: tar@1.30
      prefix: /usr
  unzip:
    buildable: false
    externals:
    - spec: unzip@6.0
      prefix: /usr
  zlib:
    buildable: false
    externals:
    - spec: zlib@1.2.11
      prefix: /usr

  # Installed CUDA catalog; CUDA stacks override it with one verified version.
  cuda:
    version: [12.2.0, 11.8.0]
    buildable: false
    externals:
    - spec: cuda@12.2.0
      prefix: /usr/tce/packages/cuda/cuda-12.2.0
    - spec: cuda@11.8.0
      prefix: /usr/tce/packages/cuda/cuda-11.8.0
