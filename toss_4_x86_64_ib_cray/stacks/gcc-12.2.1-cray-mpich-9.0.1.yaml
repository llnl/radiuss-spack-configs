# Complete compiler stack; shared packages.yaml retains generic externals.
packages:
  c:
    require:
    - gcc@=12.2.1
  cxx:
    require:
    - gcc@=12.2.1
  fortran:
    require:
    - gcc@=12.2.1
  gcc:
    buildable: false
    externals:
    - spec: gcc@12.2.1 languages='c,c++,fortran'
      prefix: /usr/tce/packages/gcc/gcc-12.2.1-magic
      extra_attributes:
        compilers:
          c: /usr/tce/packages/gcc/gcc-12.2.1-magic/bin/gcc
          cxx: /usr/tce/packages/gcc/gcc-12.2.1-magic/bin/g++
          fortran: /usr/tce/packages/gcc/gcc-12.2.1-magic/bin/gfortran
        flags: {}
        environment: {}
        extra_rpaths: []
  gcc-runtime:
    require:
    - '@=12.2.1 %gcc@=12.2.1'
  mpi:
    require:
    - cray-mpich@=9.0.1
  cray-mpich:
    buildable: false
    externals:
    - spec: cray-mpich@9.0.1%gcc@12.2.1
      prefix: /usr/tce/packages/cray-mpich/cray-mpich-9.0.1-gcc-12.2.1-magic
