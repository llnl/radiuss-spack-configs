    - '@=6.4.3'
    buildable: false
    externals:
    - spec: rocblas@6.4.3%llvm-amdgpu@6.4.3
      prefix: /opt/rocm-6.4.3
  rocsolver:
    require:
    - '@=6.4.3'
    buildable: false
