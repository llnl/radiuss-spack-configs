# Complete compiler stack; shared packages.yaml retains generic externals.
# Spack declares ROCm Fortran only from version 7; use the selected GCC.
packages:
  c:
    require:
    - llvm-amdgpu@=5.7.1
  cxx:
    require:
    - llvm-amdgpu@=5.7.1
  fortran:
    require:
    - gcc@=13.3.1
  llvm-amdgpu:
    buildable: false
    externals:
    - spec: llvm-amdgpu@5.7.1
      prefix: /opt/rocm-5.7.1
      extra_attributes:
        compilers:
          c: /opt/rocm-5.7.1/llvm/bin/amdclang
          cxx: /opt/rocm-5.7.1/llvm/bin/amdclang++
        flags: {}
        environment: {}
        extra_rpaths: [/opt/rocm-5.7.1/lib, /opt/rocm-5.7.1/llvm/lib]
  gcc:
    buildable: false
    externals:
    - spec: gcc@13.3.1 languages='c,c++,fortran'
      prefix: /usr/tce/packages/gcc/gcc-13.3.1-magic
      extra_attributes:
        compilers:
          c: /usr/tce/packages/gcc/gcc-13.3.1-magic/bin/gcc
          cxx: /usr/tce/packages/gcc/gcc-13.3.1-magic/bin/g++
          fortran: /usr/tce/packages/gcc/gcc-13.3.1-magic/bin/gfortran
        flags: {}
        environment: {}
        extra_rpaths: []
  gcc-runtime:
    require:
    - '@=13.3.1 %gcc@=13.3.1'
  mpi:
    require:
    - cray-mpich@=8.1.28
  cray-mpich:
    buildable: false
    externals:
    - spec: cray-mpich@8.1.28%llvm-amdgpu@5.7.1
      prefix: /usr/tce/packages/cray-mpich/cray-mpich-8.1.28-rocmcc-5.7.1-magic
  hip:
    require:
    - '@=5.7.1'
    buildable: false
    externals:
    - spec: hip@5.7.1%llvm-amdgpu@5.7.1
      prefix: /opt/rocm-5.7.1/hip
  hipsparse:
    require:
    - '@=5.7.1'
    buildable: false
    externals:
    - spec: hipsparse@5.7.1%llvm-amdgpu@5.7.1
      prefix: /opt/rocm-5.7.1
  hipblas:
    require:
    - '@=5.7.1'
    buildable: false
    externals:
    - spec: hipblas@5.7.1%llvm-amdgpu@5.7.1
      prefix: /opt/rocm-5.7.1
  hipsolver:
    require:
    - '@=5.7.1'
    buildable: false
    externals:
    - spec: hipsolver@5.7.1%llvm-amdgpu@5.7.1
      prefix: /opt/rocm-5.7.1
  hsa-rocr-dev:
    require:
    - '@=5.7.1'
    buildable: false
    externals:
    - spec: hsa-rocr-dev@5.7.1%llvm-amdgpu@5.7.1
      prefix: /opt/rocm-5.7.1
  rocminfo:
    require:
    - '@=5.7.1'
    buildable: false
    externals:
    - spec: rocminfo@5.7.1%llvm-amdgpu@5.7.1
      prefix: /opt/rocm-5.7.1
  rocm-device-libs:
    require:
    - '@=5.7.1'
    buildable: false
    externals:
    - spec: rocm-device-libs@5.7.1%llvm-amdgpu@5.7.1
      prefix: /opt/rocm-5.7.1
  rocprim:
    require:
    - '@=5.7.1'
    buildable: false
    externals:
    - spec: rocprim@5.7.1%llvm-amdgpu@5.7.1
      prefix: /opt/rocm-5.7.1
  rocthrust:
    require:
    - '@=5.7.1'
    buildable: false
    externals:
    - spec: rocthrust@5.7.1%llvm-amdgpu@5.7.1
      prefix: /opt/rocm-5.7.1
  rocsparse:
    require:
    - '@=5.7.1'
    buildable: false
    externals:
    - spec: rocsparse@5.7.1%llvm-amdgpu@5.7.1
      prefix: /opt/rocm-5.7.1
  rocrand:
    require:
    - '@=5.7.1'
    buildable: false
    externals:
    - spec: rocrand@5.7.1%llvm-amdgpu@5.7.1
      prefix: /opt/rocm-5.7.1
  rocblas:
    require:
    - '@=5.7.1'
    buildable: false
    externals:
    - spec: rocblas@5.7.1%llvm-amdgpu@5.7.1
      prefix: /opt/rocm-5.7.1
  rocsolver:
    require:
    - '@=5.7.1'
    buildable: false
    externals:
    - spec: rocsolver@5.7.1%llvm-amdgpu@5.7.1
      prefix: /opt/rocm-5.7.1
  rocm-core:
