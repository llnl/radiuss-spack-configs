# Complete compiler stack; shared packages.yaml retains generic externals.
packages:
  c:
    require:
    - cce@=20.0.0
  cxx:
    require:
    - cce@=20.0.0
  fortran:
    require:
    - cce@=20.0.0
  cce:
    buildable: false
    externals:
    - spec: cce@20.0.0
      prefix: /usr/tce/packages/cce-tce/cce-20.0.0
      extra_attributes:
        compilers:
          c: /usr/tce/packages/cce-tce/cce-20.0.0/bin/craycc
          cxx: /usr/tce/packages/cce-tce/cce-20.0.0/bin/crayCC
          fortran: /usr/tce/packages/cce-tce/cce-20.0.0/bin/crayftn
        flags: {}
        environment: {}
        extra_rpaths: [/opt/cray/pe/mpich/9.0.1/gtl/lib]
  mpi:
    require:
    - cray-mpich@=9.0.1
  cray-mpich:
    buildable: false
    externals:
    - spec: cray-mpich@9.0.1%cce@20.0.0
      prefix: /usr/tce/packages/cray-mpich/cray-mpich-9.0.1-cce-20.0.0-magic
  cuda:
    version: [12.2.0, 11.8.0]
    buildable: false
    externals:
    - spec: cuda@12.2.0
      prefix: /usr/tce/packages/cuda/cuda-12.2.0
    - spec: cuda@11.8.0
      prefix: /usr/tce/packages/cuda/cuda-11.8.0
